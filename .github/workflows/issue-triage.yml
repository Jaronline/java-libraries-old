name: Issue Triage
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  issue-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v3.5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/issue-labeler.yml
          not-before: 2026-10-19T15:04:44.944Z
          enable-versioned-regex: 0